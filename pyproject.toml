[tool.poetry]
name = "retail-power-mvp"
version = "0.1.0"
description = ""
authors = ["helio <hquintanilhajr@gmail.com>"]
readme = "README.md"
packages = [
  { include = "powerdash", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12"
pandas = ">=2.3.3,<3.0.0"
numpy = ">=2.3.5,<3.0.0"
pydantic = ">=2.12.5,<3.0.0"
plotly = ">=6.5.0,<7.0.0"
streamlit = ">=1.52.2,<2.0.0"
matplotlib = "^3.10.8"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.14.10"
black = "^25.12.0"
